<!DOCTYPE html>
<html lang="en">
<head>

  <script src="SigWebTablet.js"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .print\:hidden { display: none !important; }
      .print-page { page-break-after: always !important; padding: 0.5in !important; page-break-inside: avoid !important; box-sizing: border-box; width: 100% !important; }
      .print-page:last-of-type { page-break-after: auto !important; }
      /* Per-page scaling so specific pages fit better when using 'fit to page' */
      .print-scale-96 { -webkit-transform: scale(0.96); transform: scale(0.96); transform-origin: top left; width: calc(100% / 0.96) !important; padding: 0.25in !important; }
      .print-scale-80 { -webkit-transform: scale(0.80); transform: scale(0.80); transform-origin: top left; width: calc(100% / 0.80) !important; }
      .print-scale-75 { -webkit-transform: scale(0.75); transform: scale(0.75); transform-origin: top left; width: calc(100% / 0.75) !important; padding: 0.25in !important; }
      .print-scale-70 { -webkit-transform: scale(0.70); transform: scale(0.70); transform-origin: top left; width: calc(100% / 0.70) !important; padding: 0.25in !important; }
      .print-scale-65 { -webkit-transform: scale(0.65); transform: scale(0.65); transform-origin: top left; width: calc(100% / 0.65) !important; padding: 0.25in !important; }
      .print-scale-60 { -webkit-transform: scale(0.60); transform: scale(0.60); transform-origin: top left; width: calc(100% / 0.60) !important; padding: 0.2in !important; }
      .print-loss-notice { padding: 0.5in 0.5in 0.5in 0.5in !important; }
      .print-loss-notice-claimant { padding: 0.15in 0.25in 0.25in 0.25in !important; font-size: 10px !important; line-height: 1.2 !important; page-break-after: auto !important; }
      .print-loss-notice-claimant:last-of-type { page-break-after: auto !important; }
      .print-loss-notice-claimant input, .print-loss-notice-claimant textarea { font-size: 9px !important; padding: 1px 2px !important; }
      .print-loss-notice-claimant .text-sm { font-size: 9px !important; }
      .print-loss-notice-claimant .text-xs { font-size: 8px !important; }
      .print-loss-notice-claimant .mb-1 { margin-bottom: 0.1rem !important; }
      .print-loss-notice-claimant .mb-2 { margin-bottom: 0.2rem !important; }
      .print-loss-notice-claimant .mb-3 { margin-bottom: 0.2rem !important; }
      .print-loss-notice-claimant .my-1 { margin-top: 0.1rem !important; margin-bottom: 0.1rem !important; }
      .print-loss-notice-claimant .my-2 { margin-top: 0.15rem !important; margin-bottom: 0.15rem !important; }
      .print-loss-notice-claimant .gap-1 { gap: 0.1rem !important; }
      .print-loss-notice-claimant .gap-2 { gap: 0.15rem !important; }
      .print-loss-notice-claimant .gap-4 { gap: 0.2rem !important; }
      .print-loss-notice-claimant .p-2 { padding: 0.2rem !important; }
      .print-loss-notice-claimant .p-4 { padding: 0.3rem !important; }
      .print-loss-notice-claimant h2 { font-size: 14px !important; margin: 0 !important; }
      .print-loss-notice-claimant img { height: 35px !important; }
      .print-loss-notice-policyholder { padding: 0.15in 0.25in 0.25in 0.25in !important; font-size: 10px !important; line-height: 1.2 !important; page-break-after: auto !important; }
      .print-loss-notice-policyholder:last-of-type { page-break-after: auto !important; }
      .print-loss-notice-policyholder input, .print-loss-notice-policyholder textarea { font-size: 9px !important; padding: 1px 2px !important; }
      .print-loss-notice-policyholder .text-sm { font-size: 9px !important; }
      .print-loss-notice-policyholder .text-xs { font-size: 8px !important; }
      .print-loss-notice-policyholder .mb-1 { margin-bottom: 0.1rem !important; }
      .print-loss-notice-policyholder .mb-2 { margin-bottom: 0.2rem !important; }
      .print-loss-notice-policyholder .mb-3 { margin-bottom: 0.2rem !important; }
      .print-loss-notice-policyholder .my-1 { margin-top: 0.1rem !important; margin-bottom: 0.1rem !important; }
      .print-loss-notice-policyholder .my-2 { margin-top: 0.15rem !important; margin-bottom: 0.15rem !important; }
      .print-loss-notice-policyholder .gap-1 { gap: 0.1rem !important; }
      .print-loss-notice-policyholder .gap-2 { gap: 0.15rem !important; }
      .print-loss-notice-policyholder .p-2 { padding: 0.2rem !important; }
      .print-loss-notice-policyholder .p-4 { padding: 0.3rem !important; }
      .print-loss-notice-policyholder h2 { font-size: 14px !important; margin: 0 !important; }
      .print-loss-notice-policyholder img { height: 35px !important; }
      .print-statement-occurrence { padding: 0.2in 0.3in 0.2in 0.3in !important; font-size: 10px !important; line-height: 1.2 !important; page-break-after: auto !important; }
      .print-statement-occurrence .mb-4 { margin-bottom: 0.15rem !important; }
      .print-statement-occurrence .mb-6 { margin-bottom: 0.2rem !important; }
      .print-statement-occurrence .mt-2 { margin-top: 0.1rem !important; }
      .print-statement-occurrence .pt-3 { padding-top: 0.15rem !important; }
      .print-statement-occurrence .p-6 { padding: 0.3rem !important; }
      .print-statement-occurrence .gap-x-8 { gap: 0.3rem !important; }
      .print-statement-occurrence .gap-y-3 { gap: 0.15rem !important; }
      .print-statement-occurrence h2 { font-size: 13px !important; margin-bottom: 0.2rem !important; }
      .print-statement-occurrence img { height: 30px !important; }
      .print-statement-occurrence input, .print-statement-occurrence textarea { font-size: 9px !important; padding: 1px 2px !important; }
      .print-statement-occurrence textarea { line-height: 1.4 !important; background-size: 100% 1.35rem !important; }
      .print-statement-occurrence .text-xs { font-size: 7px !important; }
      .print-statement-occurrence .text-xl { font-size: 13px !important; }
      .print-medicare-form { padding: 0.4in 0.5in 0.4in 0.5in !important; font-size: 14px !important; line-height: 1.4 !important; page-break-after: auto !important; }
      .print-medicare-form .mb-1 { margin-bottom: 0.14rem !important; }
      .print-medicare-form .mb-0\.5 { margin-bottom: 0.11rem !important; }
      .print-medicare-form .mb-2 { margin-bottom: 0.21rem !important; }
      .print-medicare-form .mb-3 { margin-bottom: 0.28rem !important; }
      .print-medicare-form .mt-0\.5 { margin-top: 0.11rem !important; }
      .print-medicare-form .p-1\.5 { padding: 0.21rem !important; }
      .print-medicare-form .p-3 { padding: 0.35rem !important; }
      .print-medicare-form .px-2 { padding-left: 0.21rem !important; padding-right: 0.21rem !important; }
      .print-medicare-form .py-0\.5 { padding-top: 0.11rem !important; padding-bottom: 0.11rem !important; }
      .print-medicare-form .gap-1\.5 { gap: 0.21rem !important; }
      .print-medicare-form .gap-2 { gap: 0.21rem !important; }
      .print-medicare-form .space-y-0\.5 > * + * { margin-top: 0.14rem !important; }
      .print-medicare-form h2 { font-size: 15px !important; margin-bottom: 0.14rem !important; }
      .print-medicare-form .text-xs { font-size: 12.5px !important; line-height: 1.3 !important; }
      .print-medicare-form .text-sm { font-size: 13px !important; }
      .print-medicare-form input, .print-medicare-form textarea { font-size: 12.5px !important; padding: 1px 3px !important; }
      .print-medicare-form textarea { line-height: 1.4 !important; }
      .print-medicare-form .leading-tight { line-height: 1.3 !important; }
      .print-medicare-form img { height: 42px !important; }
      .print-medicare-form .w-32 { width: 8.4rem !important; }
      .print-medical-auth { padding: 0.4in 0.5in 0.4in 0.5in !important; font-size: 13.2px !important; line-height: 1.4 !important; page-break-after: always !important; }
      .print-medical-auth .mb-6 { margin-bottom: 0.36rem !important; }
      .print-medical-auth .mt-8 { margin-top: 0.48rem !important; }
      .print-medical-auth .mt-4 { margin-top: 0.3rem !important; }
      .print-medical-auth .mt-2 { margin-top: 0.18rem !important; }
      .print-medical-auth .mb-1 { margin-bottom: 0.12rem !important; }
      .print-medical-auth .p-8 { padding: 0.6rem !important; }
      .print-medical-auth .gap-4 { gap: 0.36rem !important; }
      .print-medical-auth .space-y-3 > * + * { margin-top: 0.3rem !important; }
      .print-medical-auth .text-sm { font-size: 12px !important; line-height: 1.4 !important; }
      .print-medical-auth .text-right { font-size: 10.8px !important; }
      .print-medical-auth .font-bold { font-size: 12px !important; }
      .print-medical-auth img { height: 48px !important; }
      .print-medical-auth input { font-size: 12px !important; padding: 2px 3px !important; }
      .print-medical-auth .leading-relaxed { line-height: 1.4 !important; }
      input, textarea { border-bottom: 1px solid #000 !important; background: transparent !important; }
    }
    .signature-button { transition: all 0.2s ease; }
    .signature-button:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function GuardianFormsApp() {
      const [formData, setFormData] = useState({
        fullName: '', dateForm1: '', dateForm2: '', printName1: '', printName2: '',
        dateOfBirth1: '', dateOfBirth2: '', ssn1: '', ssn2: '',
        medicareEnrolled: '', medicareClaimNumber: '', medicareGender: '', ifrClaimNumber: '', refusalReason: '', completingPersonName: '',
        yourName: '', mailingAddress: '', physicalAddress: '', homePhone: '', busPhone: '', cellPhone: '', email: '',
        dateOfAccident: '', locationOfAccident: '', year: '', make: '', model: '', licensePlate: '', color: '', vinNumber: '',
        lienholder: '', damageDescription: '', vehicleLocation: '', accidentDescription: '',
        chargedByPolice: '', chargeDetails: '', acceptingResponsibility: '', responsibilityReason: '',
        insuredWithGuardian: '', insuranceCompanyName: '', filedClaimWithOwnInsurance: '', paidByOwnInsurance: '',
        amountPaid: '', datePaid: '',
        witness1Name: '', witness1Address: '', witness1Phone: '',
        witness2Name: '', witness2Address: '', witness2Phone: '',
        witness3Name: '', witness3Address: '', witness3Phone: '',
        passengers: '', passengersInCar: '',
        wereYouInjured: '', seekingMedicalAttention: '', medicalClaim: '', medicalCarrier: '', anythingElse: '', claimNumber: '',
        driverName: '', driverRelationship: '', driverAge: '', driverHasLicense: '', driverHasPermission: '',
        carTowed: '', carDrivable: '', agentBrokerName: '', driverContactNumber: '', driverAddress: '',
        otherPartyName: '', otherCarDamage: '', hasWitnesses: '',
        passenger1Name: '', passenger1Age: '', passenger1Relationship: '', passenger1Injuries: '',
        passenger2Name: '', passenger2Age: '', passenger2Relationship: '', passenger2Injuries: '',
        passenger3Name: '', passenger3Age: '', passenger3Relationship: '', passenger3Injuries: '',
        anythingElsePolicyholder: '',
        statementOf: '', statementDate: '', statementDateOfBirth: '', statementHomePhone: '', statementCellphone: '', statementText: '', statementInitials: ''
      });

      const [sigImage1, setSigImage1] = useState(null);
      const [sigImage2, setSigImage2] = useState(null);
      const [sigImage3, setSigImage3] = useState(null);
      const [sigImage4, setSigImage4] = useState(null);
      const [sigImage5, setSigImage5] = useState(null);
      const [sigImage6, setSigImage6] = useState(null);
      const [currentForm, setCurrentForm] = useState(1);
      const [currentSubPage, setCurrentSubPage] = useState(null);
      const [sigWebStatus, setSigWebStatus] = useState('checking');
      const [showPrintMenu, setShowPrintMenu] = useState(false);
      const [printAllForms, setPrintAllForms] = useState(false);
      const [tabletTimer, setTabletTimer] = useState(null);

      useEffect(() => {
        if (typeof IsSigWebInstalled === 'undefined') {
          console.error("SigWebTablet.js script not loaded!");
          setSigWebStatus('not_loaded');
          return;
        }

        setTimeout(() => {
          try {
            if (IsSigWebInstalled()) {
              const version = GetSigWebVersion();
              if (!version || version === "1.5") {
                console.error("SigWeb service not running or not responding.");
                setSigWebStatus('not_loaded');
              } else {
                console.log("SigWeb Version:", version);
                setSigWebStatus('ready');
              }
            } else {
              console.error("SigWeb service not installed.");
              setSigWebStatus('not_loaded');
            }
          } catch (e) {
            console.error("Error checking SigWeb:", e);
            setSigWebStatus('not_loaded');
          }
        }, 500);

        return () => {
          try {
            if (typeof Reset !== 'undefined') {
              Reset();
            }
          } catch (e) {
            console.error('Error resetting tablet:', e);
          }
        };
      }, []);

      const handleInputChange = (e) => {
        setFormData({...formData, [e.target.name]: e.target.value});
      };

      const captureSignature = (formNum) => {
        if (sigWebStatus !== 'ready') {
          let msg;
          switch (sigWebStatus) {
            case 'not_loaded':
              msg = 'SigWeb service is not running. Please install or start the Topaz SigWeb service.';
              break;
            case 'no_device':
              msg = 'Signature pad not detected. Please check the USB connection.';
              break;
            default:
              msg = 'Signature pad is not ready.';
          }
          alert(msg);
          return;
        }

        try {
          // Create a modal dialog for signature capture
          const modal = document.createElement('div');
          modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000;';

          const dialog = document.createElement('div');
          dialog.style.cssText = 'background:white;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';

          const title = document.createElement('h3');
          title.textContent = 'Please sign on the signature pad';
          title.style.cssText = 'margin:0 0 15px 0;text-align:center;';

          const canvas = document.createElement('canvas');
          canvas.id = 'sigCanvas' + formNum;
          canvas.width = 500;
          canvas.height = 100;
          canvas.style.cssText = 'border:1px solid #ccc;display:block;margin:0 auto 15px auto;';

          const buttonContainer = document.createElement('div');
          buttonContainer.style.cssText = 'display:flex;gap:10px;justify-content:center;';

          const acceptBtn = document.createElement('button');
          acceptBtn.textContent = 'Accept';
          acceptBtn.style.cssText = 'px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700';
          acceptBtn.className = 'px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700';

          const clearBtn = document.createElement('button');
          clearBtn.textContent = 'Clear';
          clearBtn.style.cssText = 'px-4 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700';
          clearBtn.className = 'px-4 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700';

          const cancelBtn = document.createElement('button');
          cancelBtn.textContent = 'Cancel';
          cancelBtn.style.cssText = 'px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700';
          cancelBtn.className = 'px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700';

          buttonContainer.appendChild(clearBtn);
          buttonContainer.appendChild(acceptBtn);
          buttonContainer.appendChild(cancelBtn);

          dialog.appendChild(title);
          dialog.appendChild(canvas);
          dialog.appendChild(buttonContainer);
          modal.appendChild(dialog);
          document.body.appendChild(modal);

          // Get canvas context
          const ctx = canvas.getContext('2d');

          // Clear the canvas
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Clear the tablet
          ClearTablet();

          // Set image output size for GetSigImageB64
          SetImageXSize(500);
          SetImageYSize(100);

          // Activate the tablet (this sets display size automatically from canvas)
          const tmr = SetTabletState(1, ctx, 50);
          setTabletTimer(tmr);

          console.log("Tablet activated, timer:", tmr);

          // Clear button handler
          clearBtn.onclick = () => {
            ClearTablet();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          };

          // Accept button handler
          acceptBtn.onclick = () => {
            const numPoints = NumberOfTabletPoints();
            console.log("Number of points:", numPoints);
            if (numPoints === 0) {
              alert('Please sign before accepting.');
              return;
            }

            // Get signature image
            GetSigImageB64((imgData) => {
              console.log("Got signature image, length:", imgData ? imgData.length : 0);
              const imageData = 'data:image/png;base64,' + imgData;
              if (formNum === 1) setSigImage1(imageData);
              else if (formNum === 2) setSigImage2(imageData);
              else if (formNum === 3) setSigImage3(imageData);
              else if (formNum === 4) setSigImage4(imageData);
              else if (formNum === 5) setSigImage5(imageData);
              else if (formNum === 6) setSigImage6(imageData);

              // Cleanup
              SetTabletState(0, tmr);
              ClearTablet();
              document.body.removeChild(modal);
            });
          };

          // Cancel button handler
          cancelBtn.onclick = () => {
            SetTabletState(0, tmr);
            ClearTablet();
            document.body.removeChild(modal);
          };

        } catch (e) {
          console.error('Error capturing signature:', e);
          alert('Error capturing signature: ' + e.message);
        }
      };

      const clearSignature = (formNum) => {
        if (formNum === 1) setSigImage1(null);
        else if (formNum === 2) setSigImage2(null);
        else if (formNum === 3) setSigImage3(null);
        else if (formNum === 4) setSigImage4(null);
        else if (formNum === 5) setSigImage5(null);
        else if (formNum === 6) setSigImage6(null);
      };

      const handlePrint = (formNum = null, pageNum = null) => {
        if (formNum === null) {
          setPrintAllForms(true);
          setTimeout(() => { window.print(); setPrintAllForms(false); }, 500);
        } else {
          const backupForm = currentForm;
          const backupSub = currentSubPage;
          setCurrentForm(formNum);
          // If pageNum is null, render all pages for that form; otherwise render only that page
          setCurrentSubPage(pageNum === null ? null : pageNum);
          setTimeout(() => { window.print(); setCurrentForm(backupForm); setCurrentSubPage(backupSub); }, 500);
        }
        setShowPrintMenu(false);
      };

      const SignatureField = ({formNum, sigImage, label}) => (
        <div>
          <label className="block text-sm font-medium mb-1">{label}:</label>
          {sigImage ? (
            <div className="relative">
              <img src={sigImage} alt="Signature" className="border border-gray-300 h-16 w-full object-contain" />
              <button onClick={() => clearSignature(formNum)}
                className="absolute top-0 right-0 bg-red-500 text-white px-2 py-1 text-xs rounded print:hidden hover:bg-red-600">
                Clear
              </button>
            </div>
          ) : (
            <button onClick={() => captureSignature(formNum)} disabled={sigWebStatus !== 'ready'}
              className={`signature-button flex items-center gap-2 px-4 py-2 rounded-lg print:hidden ${
                sigWebStatus === 'ready' ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-300 text-gray-500 cursor-not-allowed'
              }`}>
              ✍️ Sign with Topaz
            </button>
          )}
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-100 p-4">
          <div className="max-w-4xl mx-auto">
            {/* Header */}
            <div className="bg-white rounded-lg shadow-md p-6 mb-6 print:hidden">
              <h1 className="text-2xl font-bold mb-4">Guardian Insurance Authorization Forms</h1>
              
              {/* Status */}
              <div className={`px-3 py-2 rounded border mb-4 ${
                sigWebStatus === 'ready' ? 'bg-green-50 border-green-300 text-green-800' :
                sigWebStatus === 'no_device' ? 'bg-yellow-50 border-yellow-300 text-yellow-800' :
                'bg-red-50 border-red-300 text-red-800'
              }`}>
                {sigWebStatus === 'ready' ? '✅ Signature Pad Connected' :
                 sigWebStatus === 'no_device' ? '⚠️ Signature pad not detected' :
                 '❌ SigWeb Not Available'}
              </div>

              {/* Tabs */}
              <div className="flex gap-2 mb-4">
                {[
                  {num: 1, label: 'Employment'},
                  {num: 2, label: 'Insurance'},
                  {num: 3, label: 'Medical'},
                  {num: 4, label: 'Loss Notice Claimants'},
                  {num: 5, label: 'Loss Notice Policyholders'},
                  {num: 6, label: 'Statement of Occurrence'}
                ].map(({num, label}) => (
                  <button key={num} onClick={() => { setCurrentForm(num); setCurrentSubPage(null); }}
                    className={`flex-1 py-2 px-4 rounded-lg font-medium ${
                      currentForm === num ? 'bg-blue-600 text-white' : 'bg-gray-200 hover:bg-gray-300'
                    }`}>
                    {label}
                  </button>
                ))}
              </div>

              {/* Print Menu */}
              <div className="relative">
                <button onClick={() => setShowPrintMenu(!showPrintMenu)}
                  className="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">
                  🖨️ Print {showPrintMenu ? '▲' : '▼'}
                </button>
                {showPrintMenu && (
                  <div className="absolute right-0 mt-2 w-64 bg-white rounded shadow-lg border z-50">
                    <button onClick={() => handlePrint(null)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print All Forms</button>
                    <div className="border-t"></div>
                    <button onClick={() => handlePrint(1)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print Employment</button>
                    <button onClick={() => handlePrint(2)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print Insurance</button>
                    <button onClick={() => handlePrint(3)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print Medical</button>
                    <button onClick={() => handlePrint(4)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print Loss Notice Claimants</button>
                    <button onClick={() => handlePrint(5)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print Loss Notice Policyholders</button>
                    <button onClick={() => handlePrint(6)} className="w-full text-left px-4 py-2 hover:bg-gray-100">Print Statement of Occurrence</button>
                  </div>
                )}
              </div>
            </div>

            {/* Form 1: Employment Authorization */}
            {(currentForm === 1 || printAllForms) && (
              <div className="bg-white rounded-lg shadow-md p-8 print-page">
                <div className="border-2 border-gray-300 p-8">
                  <div className="flex justify-between mb-6">
                    <div>
                      <img src="guardian.png" alt="Guardian Insurance" className="h-12" />
                    </div>
                    <div className="text-right text-sm">
                      <div>9716 Estate Thomas Suite 200</div>
                      <div>St. Thomas, VI 00802</div>
                      <div>Tel: (340)776-8050</div>
                    </div>
                    <div className="text-right font-bold">
                      EMPLOYMENT RECORDS<br/>AUTHORIZATION
                    </div>
                  </div>

                  <div className="mb-6 text-sm leading-relaxed">
                    I, <input type="text" name="fullName" value={formData.fullName} onChange={handleInputChange}
                      className="border-b border-gray-400 px-2 py-1 w-64 focus:outline-none" placeholder="Enter full name" /> undersigned,
                    hereby authorize any person, corporation, entity or governmental agency, department or subdivision or office to provide
                    to GUARDIAN INSURANCE COMPANY or their authorized representative, any and all information and records pertaining to my
                    employment, including but not limited to my personnel records, my wages or salary, dates of employment and of absences
                    from work, compensation for absences from work, employment benefits, and job description. I further authorize the release
                    of any and all records pertaining to any Workmen's Compensation claims or proceedings, or any claims or proceedings before
                    the Virgin Islands Department of Labor or any claim or proceeding before the Social Security Administration. A photocopy

                      <label className="font-bold w-1/3">Date of Birth:</label>
                      <input type="date" name="statementDateOfBirth" value={formData.statementDateOfBirth} onChange={handleInputChange}
                        className="flex-1 border-b border-black px-2 py-1 focus:outline-none" />
                    </div>
                    <div className="flex items-center">
                      <label className="font-bold w-1/3">Home #:</label>
                      <input type="tel" name="statementHomePhone" value={formData.statementHomePhone} onChange={handleInputChange}
                        className="flex-1 border-b border-black px-2 py-1 focus:outline-none" />
                    </div>
                    <div className="flex items-center">
                      <label className="font-bold w-1/3">Cellphone #:</label>
                      <input type="tel" name="statementCellphone" value={formData.statementCellphone} onChange={handleInputChange}
                        className="flex-1 border-b border-black px-2 py-1 focus:outline-none" />
                    </div>
                  </div>

                  <div className="mb-4">
                    <div className="font-bold mb-2">
                      I, <input type="text" name="statementOf" value={formData.statementOf} onChange={handleInputChange}
                        className="border-b border-black px-2 py-1 focus:outline-none inline-block w-64" /> CERTIFY THAT THE FOLLOWING
                      STATEMENT/INFORMATION IS TRUE TO THE BEST OF MY KNOWLEDGE AND
                      RECOLLECTION AND IS FREELY GIVEN TO GUARDIAN INSURANCE COMPANY.
                    </div>
                  </div>

                  <div className="mb-6">
                    <textarea name="statementText" value={formData.statementText} onChange={handleInputChange}
                      rows="20" className="w-full border-none focus:outline-none resize-none"
                      style={{lineHeight: '1.8', borderBottom: '1px solid black', backgroundImage: 'repeating-linear-gradient(transparent, transparent 1.7rem, #000 1.7rem, #000 calc(1.7rem + 1px))', backgroundSize: '100% 1.75rem'}}
                      placeholder=""></textarea>
                  </div>

                  <div className="flex justify-between items-center border-t-2 border-black pt-3">
                    <SignatureField formNum={6} sigImage={sigImage6} label="SIGNATURE" />
                    <div className="flex items-center">
                      <label className="font-bold mr-3">Initials:</label>
                      <input type="text" name="statementInitials" value={formData.statementInitials} onChange={handleInputChange}
                        className="border-b border-black px-2 py-1 focus:outline-none w-24" />
                    </div>
                  </div>

                  <div className="mt-2 text-xs">
                    <strong>NOTE:</strong> If more than one page is needed, the first page MUST be initialed by the person giving the statement.
                  </div>
                </div>
              </div>
            )}

            {/* Instructions */}
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-6 print:hidden">
              <h3 className="font-bold text-blue-900 mb-2">Instructions for Topaz T-S460-HSB-R:</h3>
              <ol className="list-decimal list-inside space-y-1 text-sm text-blue-800">
                <li>Ensure your Topaz T-S460-HSB-R signature pad is connected via USB</li>
                <li>Check that device status shows "Device Connected" above</li>
                <li>Fill out all required fields in the forms</li>
                <li>Click "Sign with Topaz" to capture signatures</li>
                <li>Sign on the physical signature pad when prompted</li>
                <li>Review forms by switching between tabs</li>
                <li>Click "Print" to print or save as PDF</li>
              </ol>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<GuardianFormsApp />, document.getElementById('root'));
  </script>
</body>
</html>
